[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/fa-core",
  "crates/fa-storage",
  "crates/fa-analytics",
]

[workspace.package]
edition = "2021"
version = "0.2.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false
