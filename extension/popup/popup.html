<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nami Collector</title>
    <link rel="stylesheet" href="../vendor/phosphor/regular/style.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div id="statusChip" class="status" data-mode="idle">
          <i class="dot" aria-hidden="true"></i>
          <span id="statusText">Готов</span>
        </div>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="btnLog" title="Журнал" aria-label="Журнал">
            <i class="ph ph-list" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn" id="btnSettings" title="Настройки" aria-label="Настройки">
            <i class="ph ph-gear" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="main" id="mainView">
        <div class="hero">
          <div class="run-wrap">
            <svg class="run-ring" viewBox="0 0 140 140" aria-hidden="true">
              <circle class="run-ring-track" cx="70" cy="70" r="62" />
              <circle id="runRing" class="run-ring-fill" cx="70" cy="70" r="62" />
            </svg>
            <button id="btnRun" type="button" class="run" aria-pressed="false" aria-label="Обновить данные">
              <span class="run-glyph" aria-hidden="true"></span>
            </button>
          </div>
          <div id="runEta" class="run-eta hidden"></div>
          <div id="runCaption" class="run-caption">Обновить данные</div>
          <div id="runHint" class="run-hint">Свежие данные за 7 дней</div>
        </div>

        <section id="attention" class="attention hidden">
          <div id="attentionTitle" class="attention-title">Кабинет не открыт</div>
          <div id="attentionText" class="attention-text">Откройте его в браузере, чтобы продолжить</div>
          <button type="button" class="capsule-btn primary" id="btnAttention">Открыть кабинет</button>
        </section>

        <section id="lastCard" class="card">
          <div class="card-row">
            <div>
              <div id="lastTitle" class="card-title">Последний сбор</div>
              <div id="lastDetail" class="card-detail muted">ещё не было</div>
            </div>
            <span id="lastMark" class="ok-mark" hidden aria-hidden="true">
              <i class="ph ph-check" aria-hidden="true"></i>
            </span>
          </div>
        </section>

        <section id="tasks" class="tasks hidden" aria-label="Этапы сбора"></section>

        <div class="resume-row">
          <button id="btnContinue" type="button" class="capsule-btn" disabled>Продолжить</button>
          <button id="btnRetryFails" type="button" class="capsule-btn" disabled>Повторить ошибки</button>
        </div>
      </main>

      <footer class="foot">
        <button type="button" class="capsule-btn" id="btnConnect">
          <i id="appDot" class="dot warn" aria-hidden="true"></i>
          <span>Приложение</span>
        </button>
        <button type="button" class="capsule-btn" id="btnOpenConsole">
          <i id="consoleDot" class="dot warn" aria-hidden="true"></i>
          <span>Кабинет</span>
        </button>
      </footer>

      <aside id="settingsSheet" class="sheet" hidden>
        <div class="sheet-head">
          <h2>Настройки сбора</h2>
          <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="Закрыть">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="sheet-section">
          <div class="sheet-label">Что собирать</div>
          <div class="seg seg--compact" role="tablist" aria-label="Режим сбора">
            <button type="button" class="seg-btn active" data-mode="refresh" id="modeRefresh">Обновить</button>
            <button type="button" class="seg-btn" data-mode="full" id="modeFull">Полный сбор</button>
          </div>
        </div>

        <div class="sheet-section" id="refreshOpts">
          <div class="sheet-label">За какой период</div>
          <div class="seg seg--compact" role="group" aria-label="Период обновления">
            <button type="button" class="seg-btn active" data-window="7d">7 дней</button>
            <button type="button" class="seg-btn" data-window="month">Текущий месяц</button>
          </div>
        </div>

        <div class="sheet-section hidden" id="fullOpts">
          <div class="sheet-label">Глубина истории</div>
          <div class="seg seg--compact" role="group" aria-label="Глубина истории">
            <button type="button" class="seg-btn" data-months="3">3 мес</button>
            <button type="button" class="seg-btn" data-months="6">6 мес</button>
            <button type="button" class="seg-btn active" data-months="12">12 мес</button>
            <button type="button" class="seg-btn" data-months="24">24 мес</button>
          </div>
        </div>

        <div class="sheet-section">
          <div class="sheet-label">Пауза между запросами</div>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="delayMinus" aria-label="Меньше">
              <i class="ph ph-minus" aria-hidden="true"></i>
            </button>
            <div class="stepper-val"><span id="delayValue">700</span> мс</div>
            <button type="button" class="stepper-btn" id="delayPlus" aria-label="Больше">
              <i class="ph ph-plus" aria-hidden="true"></i>
            </button>
          </div>
          <input id="delayMs" type="hidden" value="700" />
        </div>

        <div class="sheet-section">
          <button
            type="button"
            class="toggle is-on"
            id="onlyPublished"
            role="switch"
            aria-checked="true"
          >
            <span class="toggle-track"><i class="toggle-knob" aria-hidden="true"></i></span>
            <span class="toggle-text">Только опубликованные игры</span>
          </button>
        </div>

        <div class="sheet-section links">
          <div class="link-row">
            <span>Приложение</span>
            <button type="button" class="link-btn" id="btnPair">Переподключить</button>
          </div>
          <div class="link-row">
            <span>Кабинет Яндекс Игр</span>
            <button type="button" class="link-btn" id="btnOpenConsole2">Открыть</button>
          </div>
        </div>

        <details class="advanced">
          <summary><i class="ph ph-caret-right" aria-hidden="true"></i> Дополнительно</summary>
          <div class="block row">
            <label class="field grow">
              <span>Платформа</span>
              <select id="platformSelect">
                <option value="__total__" selected>Все</option>
                <option value="desktop">desktop</option>
                <option value="mobile">mobile</option>
                <option value="tv">tv</option>
              </select>
            </label>
          </div>
          <div class="block row">
            <label class="field">
              <span>Порт</span>
              <input id="portInput" type="number" min="1" max="65535" value="17321" />
            </label>
            <label class="field grow">
              <span>Токен</span>
              <input id="tokenInput" type="password" readonly placeholder="после подключения" />
            </label>
          </div>
          <div class="actions tight">
            <button id="btnToggle" type="button" class="capsule-btn">Пассивный сбор</button>
            <button id="btnSend" type="button" class="capsule-btn">Сбросить очередь</button>
          </div>
        </details>

        <button type="button" class="capsule-btn primary sheet-done" id="btnDoneSettings">Готово</button>
      </aside>

      <aside id="logSheet" class="sheet" hidden>
        <div class="sheet-head">
          <h2>Журнал</h2>
          <button type="button" class="icon-btn" id="btnCloseLog" aria-label="Закрыть">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>
        <ul id="events" class="events"></ul>
      </aside>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
