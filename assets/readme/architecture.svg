<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#f6f7f9"/>

  <!-- Step 1: platform console -->
  <g>
    <rect x="40" y="100" width="250" height="150" rx="20" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <circle cx="70" cy="130" r="16" fill="#e8eefc"/>
    <text x="70" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fed">1</text>
    <text x="165" y="160" text-anchor="middle" font-size="20" font-weight="650" fill="#1f2430">Консоль платформы</text>
    <text x="165" y="190" text-anchor="middle" font-size="15" fill="#6b7384">кабинет разработчика</text>
    <text x="165" y="218" text-anchor="middle" font-size="14" fill="#2f6fed">например, Яндекс Игры</text>
  </g>

  <!-- Step 2: collector -->
  <g>
    <rect x="330" y="100" width="250" height="150" rx="20" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <circle cx="360" cy="130" r="16" fill="#e8eefc"/>
    <text x="360" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fed">2</text>
    <text x="455" y="160" text-anchor="middle" font-size="20" font-weight="650" fill="#1f2430">Nami Collector</text>
    <text x="455" y="190" text-anchor="middle" font-size="15" fill="#6b7384">расширение Chrome</text>
    <text x="455" y="218" text-anchor="middle" font-size="14" fill="#6b7384">собирает статистику</text>
  </g>

  <!-- Step 3: app -->
  <g>
    <rect x="620" y="100" width="250" height="150" rx="20" fill="#2f6fed"/>
    <circle cx="650" cy="130" r="16" fill="#ffffff" fill-opacity="0.22"/>
    <text x="650" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="745" y="160" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">Nami</text>
    <text x="745" y="190" text-anchor="middle" font-size="15" fill="#dbe7ff">приложение на компьютере</text>
    <text x="745" y="218" text-anchor="middle" font-size="14" fill="#dbe7ff">очищает и считает метрики</text>
  </g>

  <!-- Step 4: local storage -->
  <g>
    <rect x="910" y="100" width="250" height="150" rx="20" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
    <circle cx="940" cy="130" r="16" fill="#e8eefc"/>
    <text x="940" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fed">4</text>
    <text x="1035" y="160" text-anchor="middle" font-size="20" font-weight="650" fill="#1f2430">Ваши данные</text>
    <text x="1035" y="190" text-anchor="middle" font-size="15" fill="#6b7384">локальная база SQLite</text>
    <text x="1035" y="218" text-anchor="middle" font-size="14" fill="#6b7384">только на этом устройстве</text>
  </g>

  <!-- Arrows -->
  <line x1="290" y1="175" x2="327" y2="175" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="175" x2="617" y2="175" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="175" x2="907" y2="175" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Arrow labels -->
  <text x="308" y="88" text-anchor="middle" font-size="13" fill="#6b7384">статистика игр</text>
  <text x="598" y="88" text-anchor="middle" font-size="13" fill="#6b7384">только localhost</text>
  <text x="888" y="88" text-anchor="middle" font-size="13" fill="#6b7384">сохранение</text>

  <!-- Privacy note -->
  <rect x="160" y="300" width="880" height="78" rx="16" fill="#ffffff" stroke="#dfe3ea" stroke-width="2"/>
  <text x="600" y="335" text-anchor="middle" font-size="17" font-weight="650" fill="#1f2430">Данные остаются у вас. Ничего не уходит в интернет.</text>
  <text x="600" y="362" text-anchor="middle" font-size="14" fill="#6b7384">Передача только на ваш компьютер по локальному токену. Секреты вырезаются до сохранения.</text>
</svg>
