  <rect x="740" y="214" width="120" height="14" rx="7" fill="#d7dce5"/>
  <rect x="740" y="252" width="200" height="30" rx="8" fill="#1f2430" opacity="0.85"/>
  <rect x="1070" y="214" width="120" height="14" rx="7" fill="#d7dce5"/>
